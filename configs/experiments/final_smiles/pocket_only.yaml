# name: 字符串；训练输出子目录名和 W&B 运行名前缀。
name: pocket_only
# output_root: POSIX 绝对路径；四项正式实验共同的训练输出根目录。
output_root: /storage/penghongen/Matcher/runs
# seed: 整数；固定 Python、NumPy、PyTorch、采样器和 DataLoader 随机源。
seed: 3409
data:
  # manifest_path: POSIX 绝对路径；阶段 E 冻结后由四项实验共同读取。
  manifest_path: /storage/penghongen/Matcher/manifests/final_train_validation/manifest.json
  # train_split / validation_split: manifest.splits 中的训练和验证键。
  train_split: train
  validation_split: validation
  # selected_only: true 只训练 Stage1 已选候选；validation 也固定为 true。
  selected_only: true
  # batch_size × accumulation_steps: 名义 global batch；A800 首选 32 × 1。
  batch_size: 32
  accumulation_steps: 1
  # num_workers / prefetch_factor: 持久工作进程数和每个进程预取批次数。
  num_workers: 8
  prefetch_factor: 2
  # pp_top_k: 公共 Dataset 参数；本变体不读取 PP token。
  pp_top_k: 2048
  # cache_gib_per_worker: 每个 Dataset 副本的 PDB 数组最近使用缓存预算。
  cache_gib_per_worker: 8.0
model:
  # variant: 只读取 A_feat_L0 的 50 维 token；不实例化 U-Net 或区域头。
  variant: pocket_only
  model_dim: 256
  # attention_heads: SMILES 图和身份清单注意力的头数。
  attention_heads: 8
  # dropout: 模型内部丢弃概率。
  dropout: 0.10
  # voxel_feature_channels / raunet_planes: 公共结构字段；本变体不实例化 U-Net。
  voxel_feature_channels: 64
  raunet_planes: [64, 256, 256, 256, 256, 256, 128, 64, 64]
  # recycle_iterations / gradient_checkpointing / bottleneck_attention_layers: 公共 U-Net 字段；本变体不消费。
  recycle_iterations: 3
  gradient_checkpointing: true
  bottleneck_attention_layers: 4
  # graph_layers: 精确 SMILES 图消息传递层数。
  graph_layers: 4
loss:
  # foreground / identity: 前景 BCE 与直接 SMILES 交叉熵系数。
  foreground: 1.0
  # pocket_only 不存在区域头，因此两项辅助损失必须显式为零。
  ligand_area: 0.0
  binding_area: 0.0
  identity: 1.0
optimization:
  # learning_rate / weight_decay: AdamW 初始学习率和权重衰减。
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  # gradient_clip_norm: 全局梯度范数阈值；200 是固定宽松裁剪。
  gradient_clip_norm: 200.0
  # max_epochs / patience_bad_epochs: 最多轮数与连续未改善 validation 数。
  max_epochs: 100
  patience_bad_epochs: 2
tracking:
  # mode: online 直接写入 W&B。
  mode: online
  # entity: null 使用当前 W&B 登录账户的默认实体。
  entity: null
  # project / group: W&B 项目和四变体共同分组名称。
  project: Matcher
  group: final_smiles_four_variants
  # log_every_updates: 每 20 次参数更新记录训练标量。
  log_every_updates: 20
