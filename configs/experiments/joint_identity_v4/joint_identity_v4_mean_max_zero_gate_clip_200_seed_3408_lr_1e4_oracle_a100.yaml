# matcher.training.config.load_experiment_plan 读取本文件；单张 A100 从零训练 mean/max、零门、clip200 对照。
# 本任务与 seed3408 的摘要拼接零门、clip200 任务只在 aggregation 与运行隔离名称上不同。
# 联合身份逐字使用 PreparedLigand 顶层 smiles；本配置不额外规范化，也不读取 model_smiles。
# gradient_clip_norm=200.0：仅当裁剪前全局梯度范数超过 200 时缩放；是否近似不裁剪由实际触发率判定。
# use_manual_features=true：mean/max 按 A/P/V/PP 顺序读取每模态的 token 数、Stage1 固化概率均值和最大值，共 12 项。
# use_sampling_features=true：mean/max 读取裁剪起点边界限制标记、相对 V 质心的 L2/L∞ 体素距离和 V 体素保留比例，共 4 项。
# v_centroid 先按 np.rint(mean(V_zyx)+0.5-24) 的半整数最近偶数规则求请求起点，再逐轴限制到 [0,32]；任一轴 requested_start_zyx != start_zyx 时边界标记为 True。
# use_candidate_token_attention_bias=false：本结构不增加候选—实体注意力偏置。
# initial_graph_gate/initial_inventory_gate=0.0：身份图与清单增量均从严格零门开始。
# null：class_weights 不加权；maximum_epochs 不设轮数上限；initialize_candidate_from 不加载 checkpoint。
plan_name: joint_identity_v4_mean_max_zero_gate_clip_200_seed_3408_lr_1e4_oracle_a100
output_root: /storage/penghongen/tmp/Matcher/experiments  # run、stage、checkpoint 和指标的根目录。
tracking:
  # provider/mode 选择 W&B online；entity/project 定位远端指标空间，group 绑定 seed3408 的同硬件结构对照。
  # log_every_global_steps=1 逐次参数更新记录训练指标；初始化失败即终止，不降级为离线记录。
  provider: wandb
  mode: online
  entity: pencounkdual-111
  project: AdaLigand-Matcher-JointIdentityV4-SummaryConcat
  group: joint-identity-v4-summary-concat-a100-seed-3408
  log_every_global_steps: 1
  init_timeout_seconds: 120  # W&B 握手秒数，不是训练或 Slurm 时限。
data:
  # data_root 与 stage1_root 只读；output_root 写入缺失清单或缓存，并复用已存在的版本化产物。
  data_root: /storage/penghongen/AdaLigand/Ori_Data  # A–G PDB 输入、occurrences.jsonl 与 PreparedLigand.smiles 的共同根目录。
  stage1_root: /storage/penghongen/AdaLigand_stage1_inference/Find_0-CPC1-ligand_PRAUC_0.675477/artifacts/Find_0
  output_root: /storage/penghongen/tmp/Matcher  # 版本化 manifest 与候选缓存根目录。
  coverage_threshold: 0.30  # 候选覆盖 occurrence 与 occurrence 覆盖候选均达到该值才命中。
  selection_seed: 3407  # 固定清单中的语言 occurrence 选择；不随 training.seed 改变。
  pp_top_k: 1024  # 每个候选保留的 Stage1 固化概率 token 上限。
  local_crop_strategy: v_centroid
  train_num_workers: 4  # 每次 train 迭代建立的非持久 DataLoader 工作进程数。
  validation_num_workers: 4  # train 工作进程退出后再建立 validation 工作进程。
  prefetch_factor: 2  # 每个工作进程预取的物理 batch 数。
  cache_gib_per_worker: 16  # 单个 worker 的五类最近最少使用缓存总预算为 16 GiB。
stages:
  - name: joint_identity_v4_mean_max_zero_gate_clip_200_seed_3408_lr_1e4_oracle_a100
    # full_matcher 联合训练六分类、区域与身份目标；smi_ted_289m 提供语言表示；oracle/all_non_background 定义身份监督来源与可见类别。
    task_name: full_matcher
    language_family: smi_ted_289m
    identity_variant: oracle
    identity_scope: all_non_background  # ion、nucleotide_like、peptide_like、small_molecule、sugar。
    model:
      aggregation: mean_max  # 每个模态分别求均值与最大值后融合为候选表示。
      use_manual_features: true
      use_sampling_features: true
      use_candidate_token_attention_bias: false
      initial_graph_gate: 0.0
      initial_inventory_gate: 0.0
      # model_dim 是公共表示宽度；attention_heads 是多头注意力头数；dropout 是训练期随机失活概率。
      model_dim: 256
      attention_heads: 8
      dropout: 0.10
      voxel_feature_channels: 48  # 候选局部体素编码器读取的输入通道数。
      # enc0、enc1、enc2、enc3、bottleneck、dec3、dec2、dec1、dec0。
      raunet_planes: [64, 256, 256, 256, 256, 256, 128, 64, 64]
      # recycle_iterations 是 RAUNet 重循环次数；gradient_checkpointing 用重计算换显存。
      # bottleneck_attention_layers 与 graph_layers 分别是瓶颈注意力层数和配体图消息传递层数。
      recycle_iterations: 3
      gradient_checkpointing: true
      bottleneck_attention_layers: 4
      graph_layers: 4
    training:
      seed: 3408  # 初始化、采样和训练随机流的共同种子，不改变 data.selection_seed。
      # physical_batch_size 是单次前向候选数；gradient_accumulation 是每次参数更新累计的物理批次数。
      physical_batch_size: 8
      gradient_accumulation: 4
      global_batch_size: 32  # 8 个候选 × 4 次梯度累积。
      learning_rate: 1.0e-4  # AdamW 初始学习率。
      weight_decay: 1.0e-4  # AdamW 解耦权重衰减系数。
      maximum_epochs: null
      patience_bad_epochs: 2  # 连续两次完整 validation 未严格改善后停止。
      precision: bf16  # 训练前向与反向采用 bfloat16 自动混合精度。
      gradient_clip_norm: 200.0
      class_weights: null  # 六分类交叉熵不额外重加权。
      # classification、ligand_area、binding_area、identity 各键分别缩放六分类、配体区域、结合区域和 oracle 身份损失。
      loss_weights: {classification: 1.0, ligand_area: 0.10, binding_area: 0.10, identity: 1.0}
    initialize_candidate_from: null
