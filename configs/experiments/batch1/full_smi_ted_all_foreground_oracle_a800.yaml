# matcher.experiment_config.load_experiment_plan 读取本文件，matcher.experiment.run_plan 执行唯一 stage。
# 第1批：单张 A800 从零训练五类非背景身份 Matcher；mean/max 聚合显式拼接固化手动特征。
# null 语义：class_weights=null 表示六分类不加权；maximum_epochs=null 表示不设轮数上限；
# initialize_candidate_from=null 表示不加载候选预训练 checkpoint。
plan_name: batch1_smi_ted_all_foreground_oracle_a800
output_root: /storage/penghongen/tmp/Matcher/experiments  # run、阶段、checkpoint 和指标的根目录。
tracking:
  # 每个 stage 建立独立 W&B online run；认证只读取服务器环境或已有 ~/.netrc。
  provider: wandb
  mode: online  # 在线初始化失败即终止，不降级为离线记录。
  entity: pencounkdual-111
  project: AdaLigand-Matcher-Batch1  # 第1批独立项目，避免与第0批曲线混排。
  group: matcher-batch1-five-class-manual-features  # 三种身份损失的共同头对头比较组。
  log_every_global_steps: 1
  init_timeout_seconds: 120  # W&B 握手秒数，不是训练或 Slurm 时限。
data:
  # data_root 与 stage1_root 只读；output_root 只写版本化清单、体素和 PP token 缓存。
  data_root: /storage/penghongen/AdaLigand/Ori_Data
  stage1_root: /storage/penghongen/AdaLigand_stage1_inference/Find_0-CPC1-ligand_PRAUC_0.675477/artifacts/Find_0
  output_root: /storage/penghongen/tmp/Matcher
  coverage_threshold: 0.30  # 候选与 occurrence 双向覆盖率均达到该值才命中。
  selection_seed: 3407  # 固定每个 PDB 内身份采用哪个有效 occurrence 语言表示。
  pp_top_k: 1024
  local_crop_strategy: fixed_center  # 复现第1批固定 [16,64)³ 视野。
  train_num_workers: 4  # 每次 train 迭代建立的非持久 DataLoader 工作进程数。
  validation_num_workers: 4  # train 工作进程退出后再建立 validation 工作进程。
  prefetch_factor: 2
  cache_gib_per_worker: 32  # 每个工作进程五类最近最少使用缓存的按需上限，单位 GiB。
stages:
  - name: batch1_smi_ted_all_foreground_oracle_a800
    task_name: full_matcher
    language_family: smi_ted_289m
    identity_variant: oracle
    identity_scope: all_non_background  # ion、nucleotide_like、peptide_like、small_molecule、sugar。
    model:
      aggregation: mean_max
      use_manual_features: true  # 候选聚合与身份 MLP 使用计数、固化概率和身份类别概率。
      use_sampling_features: false  # 第1批不读取第2批新增的裁剪几何统计。
      use_candidate_token_attention_bias: false  # 第1批 mean/max 聚合不使用候选—实体注意力偏置。
      model_dim: 256
      attention_heads: 8
      dropout: 0.10
      voxel_feature_channels: 48
      # 顺序：enc0、enc1、enc2、enc3、bottleneck、dec3、dec2、dec1、dec0。
      raunet_planes: [64, 256, 256, 256, 256, 256, 128, 64, 64]
      recycle_iterations: 3
      gradient_checkpointing: true
      bottleneck_attention_layers: 4
      graph_layers: 4
    training:
      seed: 3407
      physical_batch_size: 16
      gradient_accumulation: 2
      global_batch_size: 32
      learning_rate: 1.0e-4
      weight_decay: 1.0e-4
      maximum_epochs: null
      patience_bad_epochs: 2  # 连续两轮完整 validation 未严格改善后停止。
      precision: bf16
      gradient_clip_norm: 1.0
      class_weights: null
      # oracle 的身份系数固定为1；四项权重依次作用于六分类、两个区域和身份损失。
      loss_weights: {classification: 1.0, ligand_area: 0.10, binding_area: 0.10, identity: 1.0}
    initialize_candidate_from: null
